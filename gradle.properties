# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# APK / AAB build guard (see README "Build policy").
# Packaging tasks of :app are blocked unless the project owner explicitly approves
# an APK build. Do NOT change this value in commits; pass
# -Pwellsketch.ownerApprovedApkBuild=true on the command line only after approval.
wellsketch.ownerApprovedApkBuild=false
